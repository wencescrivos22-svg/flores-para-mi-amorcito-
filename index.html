<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para vos 💛</title>

<style>

* {

    margin: 0;

    padding: 0;

    box-sizing: border-box;

}

html, body {

    width: 100%;

    height: 100%;

    overflow: hidden;

    font-family: Georgia, "Times New Roman", serif;

    background: #02030d;

}

/* =========================

   ESCENA

========================= */

.scene {

    position: fixed;

    inset: 0;

    overflow: hidden;

    background:

        radial-gradient(circle at 50% 35%, rgba(35, 38, 90, .45), transparent 45%),

        radial-gradient(circle at 20% 20%, rgba(70, 50, 120, .25), transparent 35%),

        linear-gradient(to bottom, #02030d 0%, #080b20 55%, #111529 100%);

}

/* Luna */

.moon {

    position: absolute;

    width: 90px;

    height: 90px;

    border-radius: 50%;

    background: #fffbe1;

    right: 12%;

    top: 10%;

    box-shadow:

        0 0 20px rgba(255,255,210,.7),

        0 0 55px rgba(255,255,210,.25);

    opacity: .9;

}

.moon::after {

    content: "";

    position: absolute;

    width: 90px;

    height: 90px;

    border-radius: 50%;

    background: #080b20;

    left: 28px;

    top: -8px;

}

/* =========================

   ESTRELLAS

========================= */

.stars,

.stars2,

.shooting-stars {

    position: absolute;

    inset: 0;

    pointer-events: none;

}

.stars {

    background-image:

        radial-gradient(circle, white 1px, transparent 1.5px),

        radial-gradient(circle, rgba(255,255,255,.8) 1px, transparent 1.5px),

        radial-gradient(circle, rgba(255,255,255,.6) 1px, transparent 1.5px);

    background-size: 95px 95px, 145px 145px, 210px 210px;

    background-position: 10px 20px, 50px 80px, 100px 10px;

    animation: starsMove 12s linear infinite;

}

.stars2 {

    background-image:

        radial-gradient(circle, rgba(255,255,255,.9) 1px, transparent 2px),

        radial-gradient(circle, rgba(255,230,130,.8) 1px, transparent 2px);

    background-size: 170px 170px, 260px 260px;

    animation: starsMove2 18s linear infinite;

}

@keyframes starsMove {

    from {

        transform: translateY(0);

    }

    to {

        transform: translateY(40px);

    }

}

@keyframes starsMove2 {

    from {

        transform: translate(0, 0);

    }

    to {

        transform: translate(-35px, 45px);

    }

}

/* Estrellas fugaces */

.shooting-star {

    position: absolute;

    width: 3px;

    height: 3px;

    border-radius: 50%;

    background: white;

    box-shadow: 0 0 8px white;

    opacity: 0;

    transform: rotate(-35deg);

}

.shooting-star::after {

    content: "";

    position: absolute;

    width: 90px;

    height: 2px;

    right: 2px;

    top: 1px;

    background: linear-gradient(to left, transparent, rgba(255,255,255,.8));

}

.shooting-star:nth-child(1) {

    top: 15%;

    left: 10%;

    animation: shooting 5s 1s infinite;

}

.shooting-star:nth-child(2) {

    top: 25%;

    left: 75%;

    animation: shooting 7s 3s infinite;

}

.shooting-star:nth-child(3) {

    top: 8%;

    left: 55%;

    animation: shooting 6s 5s infinite;

}

@keyframes shooting {

    0%, 75% {

        opacity: 0;

        transform: translate(0, 0) rotate(-35deg);

    }

    78% {

        opacity: 1;

    }

    90% {

        opacity: 1;

        transform: translate(-180px, 120px) rotate(-35deg);

    }

    100% {

        opacity: 0;

        transform: translate(-220px, 150px) rotate(-35deg);

    }

}

/* =========================

   PANTALLA INICIAL

========================= */

.intro {

    position: absolute;

    inset: 0;

    z-index: 20;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    padding: 25px;

    text-align: center;

    transition: opacity 1.2s ease, visibility 1.2s ease;

}

.intro.hide {

    opacity: 0;

    visibility: hidden;

}

.intro h1 {

    color: #fffdf0;

    font-size: clamp(30px, 8vw, 52px);

    font-weight: normal;

    line-height: 1.15;

    text-shadow:

        0 0 10px rgba(255,255,255,.6),

        0 0 25px rgba(255,220,90,.35);

    margin-bottom: 35px;

}

.start {

    border: 1px solid rgba(255,231,125,.8);

    background: rgba(255,213,72,.12);

    color: #fff5b0;

    padding: 15px 28px;

    border-radius: 40px;

    font-size: 18px;

    font-family: Georgia, serif;

    box-shadow:

        0 0 15px rgba(255,215,70,.25),

        inset 0 0 15px rgba(255,215,70,.08);

    backdrop-filter: blur(5px);

    cursor: pointer;

    animation: buttonGlow 2s ease-in-out infinite;

}

@keyframes buttonGlow {

    0%, 100% {

        box-shadow: 0 0 15px rgba(255,215,70,.2);

    }

    50% {

        box-shadow: 0 0 30px rgba(255,215,70,.5);

    }

}

/* =========================

   PASTO

========================= */

.ground {

    position: absolute;

    bottom: 0;

    left: 0;

    width: 100%;

    height: 25%;

    background:

        linear-gradient(to bottom,

            #111c18 0%,

            #0b1713 45%,

            #06100d 100%);

    z-index: 4;

}

.grass {

    position: absolute;

    bottom: 22%;

    left: 0;

    width: 100%;

    height: 45px;

    z-index: 5;

    background:

        repeating-linear-gradient(

            75deg,

            transparent 0px,

            transparent 9px,

            rgba(44,83,43,.7) 10px,

            rgba(44,83,43,.7) 12px

        );

    opacity: .7;

}

/* =========================

   FLOR

========================= */

.flower {

    position: absolute;

    bottom: 21%;

    left: 50%;

    width: 190px;

    height: 380px;

    transform: translateX(-50%) scale(.7);

    transform-origin: bottom center;

    opacity: 0;

    z-index: 7;

    animation:

        flowerAppear 2s 1s forwards,

        flowerSway 4s 3s ease-in-out infinite;

}

@keyframes flowerAppear {

    0% {

        opacity: 0;

        transform: translateX(-50%) scale(.15);

    }

    100% {

        opacity: 1;

        transform: translateX(-50%) scale(.7);

    }

}

@keyframes flowerSway {

    0%, 100% {

        transform: translateX(-50%) scale(.7) rotate(-1deg);

    }

    50% {

        transform: translateX(-50%) scale(.7) rotate(1.5deg);

    }

}

/* Tallo */

.stem {

    position: absolute;

    bottom: 0;

    left: 50%;

    width: 13px;

    height: 255px;

    transform: translateX(-50%);

    border-radius: 10px;

    background: linear-gradient(to right, #173b1b, #4f8b32, #183c1d);

    box-shadow: 0 0 8px rgba(70,130,50,.25);

}

/* Hojas */

.leaf {

    position: absolute;

    width: 100px;

    height: 42px;

    background: linear-gradient(135deg, #244e24, #6b9b35);

    border-radius: 100% 0 100% 0;

    bottom: 75px;

}

.leaf.left {

    left: 15px;

    transform: rotate(-25deg);

}

.leaf.right {

    right: 15px;

    transform: scaleX(-1) rotate(-25deg);

}

/* Cabeza */

.head {

    position: absolute;

    left: 50%;

    bottom: 225px;

    width: 175px;

    height: 175px;

    transform: translateX(-50%);

}

/* Pétalos */

.petal {

    position: absolute;

    width: 78px;

    height: 112px;

    left: 50%;

    top: 50%;

    transform-origin: 50% 80%;

    margin-left: -39px;

    margin-top: -56px;

    border-radius: 50% 50% 45% 45%;

    background:

        radial-gradient(circle at 50% 70%, #fff36b 0%, #ffd52e 45%, #e9a900 100%);

    box-shadow:

        0 0 14px rgba(255,211,45,.45),

        inset 0 -5px 10px rgba(190,125,0,.18);

}

/* 10 pétalos */

.petal:nth-child(1)  { transform: rotate(0deg) translateY(-47px); }

.petal:nth-child(2)  { transform: rotate(36deg) translateY(-47px); }

.petal:nth-child(3)  { transform: rotate(72deg) translateY(-47px); }

.petal:nth-child(4)  { transform: rotate(108deg) translateY(-47px); }

.petal:nth-child(5)  { transform: rotate(144deg) translateY(-47px); }

.petal:nth-child(6)  { transform: rotate(180deg) translateY(-47px); }

.petal:nth-child(7)  { transform: rotate(216deg) translateY(-47px); }

.petal:nth-child(8)  { transform: rotate(252deg) translateY(-47px); }

.petal:nth-child(9)  { transform: rotate(288deg) translateY(-47px); }

.petal:nth-child(10) { transform: rotate(324deg) translateY(-47px); }

/* Centro */

.center {

    position: absolute;

    width: 62px;

    height: 62px;

    left: 50%;

    top: 50%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background:

        radial-gradient(circle at 35% 30%, #8f681d, #5a3b0c 65%, #342208);

    box-shadow:

        0 0 12px rgba(255,197,30,.4);

    z-index: 3;

}

.center::after {

    content: "";

    position: absolute;

    inset: 9px;

    border-radius: 50%;

    background-image:

        radial-gradient(circle, #d69e28 1px, transparent 2px);

    background-size: 9px 9px;

}

/* =========================

   MENSAJE

========================= */

.message {

    position: absolute;

    z-index: 10;

    left: 50%;

    top: 8%;

    transform: translateX(-50%) translateY(-20px);

    width: 88%;

    max-width: 550px;

    text-align: center;

    color: #fff9dc;

    font-size: clamp(19px, 5vw, 27px);

    line-height: 1.5;

    text-shadow:

        0 0 8px rgba(255,240,150,.6),

        0 0 20px rgba(255,210,60,.2);

    opacity: 0;

    transition: all 2s ease;

    pointer-events: none;

}

.message.show {

    opacity: 1;

    transform: translateX(-50%) translateY(0);

}

/* =========================

   PARTÍCULAS DORADAS

========================= */

.sparkles {

    position: absolute;

    inset: 0;

    z-index: 8;

    pointer-events: none;

}

.sparkle {

    position: absolute;

    width: 4px;

    height: 4px;

    background: #ffe46b;

    border-radius: 50%;

    box-shadow: 0 0 8px #ffe46b;

    animation: floatUp linear infinite;

    opacity: 0;

}

@keyframes floatUp {

    0% {

        opacity: 0;

        transform: translateY(0) scale(.5);

    }

    20% {

        opacity: .9;

    }

    100% {

        opacity: 0;

        transform: translateY(-130px) scale(1.2);

    }

}

/* Ajuste para celulares */

@media (max-width: 600px) {

    .moon {

        width: 70px;

        height: 70px;

        right: 8%;

        top: 9%;

    }

    .moon::after {

        width: 70px;

        height: 70px;

    }

    .flower {

        bottom: 20%;

        transform: translateX(-50%) scale(.58);

    }

    @keyframes flowerAppear {

        0% {

            opacity: 0;

            transform: translateX(-50%) scale(.12);

        }

        100% {

            opacity: 1;

            transform: translateX(-50%) scale(.58);

        }

    }

    @keyframes flowerSway {

        0%, 100% {

            transform: translateX(-50%) scale(.58) rotate(-1deg);

        }

        50% {

            transform: translateX(-50%) scale(.58) rotate(1.5deg);

        }

    }

    .message {

        top: 7%;

        width: 90%;

        font-size: 18px;

        line-height: 1.45;

    }

}

</style>

</head>

<body>

<div class="scene">

    <!-- ESTRELLAS -->

    <div class="stars"></div>

    <div class="stars2"></div>

    <!-- ESTRELLAS FUGACES -->

    <div class="shooting-stars">

        <div class="shooting-star"></div>

        <div class="shooting-star"></div>

        <div class="shooting-star"></div>

    </div>

    <!-- LUNA -->

    <div class="moon"></div>

    <!-- PANTALLA INICIAL -->

    <div class="intro" id="intro">

        <h1>

            Para vos,<br>

            mi princesa hermosa 💛

        </h1>

        <button class="start" onclick="startGift()">

            Abrir mi regalo ✨

        </button>

    </div>

    <!-- MENSAJE -->

    <div class="message" id="message">

        Para vos mi pequitas blanquita,<br>

        una florcilla amarillita muy hermosita<br>

        como tu carita. 💛<br><br>

        Te amo infinitote hasta la luna<br>

        a pasitos de tortuga<br>

        y de la luna al sol<br>

        a pasitos de caracol. 🌙☀️

    </div>

    <!-- PASTO -->

    <div class="ground"></div>

    <div class="grass"></div>

    <!-- UNA SOLA FLOR -->

    <div class="flower">

        <div class="stem"></div>

        <div class="leaf left"></div>

        <div class="leaf right"></div>

        <div class="head">

            <div class="petal"></div>

            <div class="petal"></div>

            <div class="petal"></div>

            <div class="petal"></div>

            <div class="petal"></div>

            <div class="petal"></div>

            <div class="petal"></div>

            <div class="petal"></div>

            <div class="petal"></div>

            <div class="petal"></div>

            <div class="center"></div>

        </div>

    </div>

    <!-- BRILLITOS -->

    <div class="sparkles" id="sparkles"></div>

</div>

<script>

function startGift() {

    document.getElementById("intro").classList.add("hide");

    setTimeout(() => {

        document.getElementById("message").classList.add("show");

    }, 3000);

    createSparkles();

}

/* Brillitos alrededor de la flor */

function createSparkles() {

    const container = document.getElementById("sparkles");

    for (let i = 0; i < 22; i++) {

        const sparkle = document.createElement("div");

        sparkle.className = "sparkle";

        sparkle.style.left = (35 + Math.random() * 30) + "%";

        sparkle.style.bottom = (18 + Math.random() * 25) + "%";

        sparkle.style.animationDuration =

            (3 + Math.random() * 4) + "s";

        sparkle.style.animationDelay =

            (Math.random() * 4) + "s";

        container.appendChild(sparkle);

    }

}

</script>

</body>

</html>
